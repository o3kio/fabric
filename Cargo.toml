[workspace]
resolver = "2"
members = [
    "crates/fabric-plan",
    "crates/fabric-linux",
    "crates/fabric-conformance",
    "crates/fabric-evidence",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.0"
repository = "https://github.com/o3kio/fabric"

[workspace.dependencies]
fabric-plan = { path = "crates/fabric-plan" }
fabric-linux = { path = "crates/fabric-linux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
